name: Manual Windows MSI Patch

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Target Release Tag to patch (e.g. v0.1.0)'
        required: true
        type: string
        default: 'v0.1.0'

permissions:
  contents: write  # Grants authorization to upload assets to your release

jobs:
  build-and-patch-windows:
    name: Build & Patch Windows MSI
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Stable Rust (MSVC Target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Set up Cargo Cache
        uses: swatinem/rust-cache@v2

      - name: Install cargo-wix Binaries
        run: cargo install cargo-wix --locked

      - name: Compile MSI Package via Native WiX
        # windows-latest runners pre-bundle the official WiX Toolset binaries natively in the system path
        run: cargo wix --nocapture --target x86_64-pc-windows-msvc

      - name: Upload Patch MSI to Existing GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          files: target/wix/*.msi
