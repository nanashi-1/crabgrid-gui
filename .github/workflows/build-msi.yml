name: Manual Windows MSI Patch

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Target Release Tag to patch (e.g. v0.1.0)'
        required: true
        type: string
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-and-patch-windows:
    name: Build & Patch Windows MSI
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Stable Rust (MSVC Target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Set up Cargo Cache
        uses: swatinem/rust-cache@v2

      - name: Install cargo-binstall
        # Installs the binstall tool instantly using the official quick script
        run: |
          Set-ExecutionPolicy Unrestricted -Scope Process
          iex (iwr "https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.ps1").Content
      - name: Install cargo-wix via binstall
        # Fetches pre-compiled cargo-wix binaries instead of compiling from source
        run: cargo binstall cargo-wix --strategy quick --yes

      - name: Compile MSI Package via Native WiX
        run: cargo wix --nocapture --target x86_64-pc-windows-msvc

      - name: Upload Patch MSI to Existing GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          files: target/wix/*.msi
